app-id: io.github.archisman_panigrahi.screen-orientation-manager
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: screen-orientation-manager
finish-args:
  # Allow access to X11 and wayland
  # - --share=network
  - --socket=x11
  - --socket=wayland
  # Allow access to udev for sensors
  # - --device=all
  # Allow access to D-Bus session bus
  # - --own-name=io.github.archisman_panigrahi.screen-orientation-manager
  # - --talk-name=org.freedesktop.ScreenSaver
  # Allow access to home for configs (optional, restrict as needed)
  - --filesystem=home:ro
modules:
  - name: screen-orientation-manager
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/archisman-panigrahi/surface-RT-screen-rotator.git
        branch: screen-orientation-manager
        # You can pin a commit or tag here if needed
